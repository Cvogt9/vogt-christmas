<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogt Christmas Connections 2026</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#242424}body{margin:0;background:#faf9f6}.wrap{max-width:530px;margin:auto;padding:22px 14px 40px}h1{text-align:center;margin:10px 0 4px;font-size:28px}p{text-align:center;margin:6px 0 20px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{min-height:74px;border:0;border-radius:5px;background:#e9e8e3;font-size:clamp(10px,2.6vw,14px);font-weight:750;overflow-wrap:anywhere;padding:4px;cursor:pointer}.tile.selected{background:#555;color:white}.solved{border-radius:6px;text-align:center;padding:16px 8px;margin:8px 0;font-weight:bold}.solved small{display:block;margin-top:5px;font-weight:normal}.controls{display:flex;gap:8px;justify-content:center;margin:18px 0}.controls button,#share,#restart{border:1px solid #333;border-radius:25px;background:white;padding:10px 16px;font-weight:bold;cursor:pointer}.controls button:disabled{opacity:.4}.status{text-align:center;margin:16px 0}.dots{letter-spacing:7px}.history{text-align:center;line-height:1.8}.result{font-size:23px;letter-spacing:2px}.footer{display:flex;gap:10px;justify-content:center;margin-top:15px}.hidden{display:none}#message{text-align:center;font-weight:bold;min-height:25px}</style></head><body><main class="wrap"><h1>🎄 Vogt Connections</h1><p>Christmas Edition · 2026<br>Find four groups of four related words.</p><div id="solved"></div><div id="board" class="board"></div><div class="status">Mistakes remaining: <span id="dots" class="dots">● ● ● ●</span></div><div id="message" aria-live="polite"></div><div class="controls"><button id="shuffle">Shuffle</button><button id="deselect">Deselect</button><button id="submit">Submit</button></div><div id="history" class="history"></div><div class="footer"><button id="share" class="hidden">Share results</button><button id="restart">Restart</button></div></main><script>
const groups=[{title:'Vogt Christmas outings of years past',words:['FENCE','FACTORY','SCROOGE','PROGRESSIVE'],color:'#a8c7e8',emoji:'🟦'},{title:'Foods from Vogt Christmas gatherings',words:['BLOSSOMS','CRINKLES','PICKLES','BUDDIES'],color:'#a8d5ae',emoji:'🟩'},{title:'Words in carols the Vogts sing',words:['JOY','AWAY','SILENT','FAITHFUL'],color:'#d7b5e8',emoji:'🟪'},{title:'Shared Vogt Christmas activities',words:['LUKE','PUZZLES','COLORING','CAROLS'],color:'#f0d887',emoji:'🟨'}];const initial=['SILENT','FENCE','BUDDIES','LUKE','JOY','FACTORY','COLORING','BLOSSOMS','SCROOGE','AWAY','PICKLES','CAROLS','PROGRESSIVE','CRINKLES','FAITHFUL','PUZZLES'];let order=[...initial],selected=[],solved=[],guesses=[],message='';const $=id=>document.getElementById(id),groupOf=w=>groups.findIndex(g=>g.words.includes(w));function render(){const over=solved.length===4||guesses.filter(g=>!g.correct).length>=4;$('solved').innerHTML='';solved.forEach(i=>{let d=document.createElement('div');d.className='solved';d.style.background=groups[i].color;d.textContent=groups[i].title;let s=document.createElement('small');s.textContent=groups[i].words.join(' · ');d.append(s);$('solved').append(d)});$('board').innerHTML='';if(!over)order.filter(w=>!solved.includes(groupOf(w))).forEach(w=>{let b=document.createElement('button');b.className='tile'+(selected.includes(w)?' selected':'');b.textContent=w;b.onclick=()=>{selected=selected.includes(w)?selected.filter(x=>x!==w):selected.length<4?[...selected,w]:selected;render()};$('board').append(b)});$('dots').textContent='● '.repeat(4-guesses.filter(g=>!g.correct).length)+'○ '.repeat(guesses.filter(g=>!g.correct).length);$('message').textContent=message|| (over?(solved.length===4?'You solved it! 🎉':'Game over!'):'');$('submit').disabled=selected.length!==4||over;$('shuffle').disabled=over;$('deselect').disabled=over||!selected.length;$('history').innerHTML='';guesses.forEach(g=>{let d=document.createElement('div');d.className='result';d.textContent=g.words.map(w=>groups[groupOf(w)].emoji).join('');$('history').append(d)});$('share').classList.toggle('hidden',!over)}$('submit').onclick=()=>{if(selected.length!==4)return;let i=groups.findIndex(g=>selected.every(w=>g.words.includes(w)));guesses.push({words:[...selected],correct:i!==-1});if(i!==-1){solved.push(i);message=solved.length===4?'You solved it! Merry Christmas! 🎄':'Correct!'}else{let mistakes=guesses.filter(g=>!g.correct).length;message=mistakes>=4?'Game over!':groups.some(g=>selected.filter(w=>g.words.includes(w)).length===3)?'One away!':'Not quite!'}selected=[];render()};$('shuffle').onclick=()=>{let arr=order.filter(w=>!solved.includes(groupOf(w)));for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}order=[...arr,...order.filter(w=>solved.includes(groupOf(w)))];selected=[];render()};$('deselect').onclick=()=>{selected=[];render()};$('restart').onclick=()=>{order=[...initial];selected=[];solved=[];guesses=[];message='';render()};$('share').onclick=async()=>{let s='Vogt Christmas Connections 🎄\n'+guesses.map(g=>g.words.map(w=>groups[groupOf(w)].emoji).join('')).join('\n')+'\n'+(solved.length===4?'Solved!':'Not solved');if(navigator.share){try{await navigator.share({text:s});return}catch(e){}}try{await navigator.clipboard.writeText(s);$('message').textContent='Results copied!'}catch(e){prompt('Copy your results:',s)}};render();
</script></body></html>
